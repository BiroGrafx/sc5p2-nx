# Sonic Adventure 2-specific analysis corrections for the code generator.
#
# Every entry needs its evidence (which tool or which log found it). The tools that produce candidates:
#   tools/find_gaps.py, tools/gap_fixpoint.py   code the automatic discovery left without a function
#   tools/pointer_scan.py                       code pointers stored in data (vtables, callback tables)
#   tools/runtime_gap_resolver.py               "Call to invalid or unregistered function" from a game log

# The CRT's setjmp/longjmp (root keys: they must stay outside any table). The game's JPEG decoder (libjpeg, around
# 0x8281xxxx-0x8282xxxx) reports errors with longjmp back to its setjmp; recompiled as plain calls, longjmp restored
# r1/r31 from the jmp_buf and then returned to its caller, which went on with a foreign stack frame (fourth boot,
# 2026-10-05: sub_8282CE30 returned with r1 0x260 higher and r31 = 0, then a read of guest 0x1A4). With the addresses
# the generator emits host setjmp/longjmp keyed by the guest jmp_buf.
#   setjmp  0x82908F10: saves v0-v127 (stvlx128 x64), r1/r2/r13-r31, f14-f31, lr, cr; returns 0
#   longjmp 0x82908AE0: the mirror image (lvx128 x64, ld x20, lfd x18, mtlr); callers in the libjpeg error path
setjmp_address = 0x82908F10
longjmp_address = 0x82908AE0

[functions]
