# The CRT's static initializer table (0x82980004-0x829801C8, walked by the C runtime before main) points at two
# entries that no code calls directly, so discovery never reached them. The first boot stopped at the first one
# ("Call to invalid or unregistered function at guest address 0x82968398"). Both are leaf initializers placed
# right after the previous function's last instruction (tools/pointer_scan.py over the REXGLUE_DUMP_IMAGE dump; every
# other entry of the table was already a function).
"0x82968398" = { }  # table entry 0x82980158: fills a global table, blr
"0x829684C8" = { }  # table entry 0x82980194: lis/addi r3 + tail call (registers a destructor)

