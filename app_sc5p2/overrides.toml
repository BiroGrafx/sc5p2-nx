# Space Channel 5 Part 2-specific analysis corrections for the code generator.
# Every entry carries its evidence (which run or tool found it).

# The CRT's setjmp/longjmp (root keys: they must stay outside any table), as in sa2-nx (app/overrides.toml). The
# game's libjpeg reports errors with longjmp back to its setjmp; recompiled as plain calls, longjmp restored r1/r31
# from the jmp_buf and returned to its caller with a foreign stack frame (Mac boot 3, 2026-10-16: sub_82204328 -
# libjpeg's SOI check, error 53 - returned to sub_82204408 with r1 0x7018E690 instead of 0x7018E430 and r31 = 0,
# then a read of guest 0x1A4).
#   setjmp  0x82284E90: stfd f14..f31, std r1/r2/r13-r31, lr, cr into r3's buffer; returns 0
#   longjmp 0x82284B70: the mirror image from the same offsets (lfd f14,0 / ld r14,160 / ld r31,296 / ld r1,144)
setjmp_address = 0x82284E90
longjmp_address = 0x82284B70

